name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"  # Автоматический запуск каждый день в полночь
  workflow_dispatch:     # Возможность запустить вручную из вкладки Actions
  push:
    branches:
      - main             # Запуск при каждом push в main ветку

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # Даём разрешение на запись в репозиторий

    steps:
      - name: Generate GitHub Contribution Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
